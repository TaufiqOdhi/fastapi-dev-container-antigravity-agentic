services:
  dev-container:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: fastapi-dev-container:antigravity
    user: "${UID:-1000}:${GID:-1000}"
    container_name: dev-container
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
      - ${HOST_SSH_DIR:-${HOME}/.ssh}:/home/devuser/.ssh:ro
      - ${HOST_GITCONFIG:-${HOME}/.gitconfig}:/home/devuser/.gitconfig:ro
      - ${HOST_GEMINI_DIR:-./antigravity-config}:/home/devuser/.gemini
      - ${HOST_LOCAL_DIR:-./local}:/home/devuser/.local
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    restart: unless-stopped

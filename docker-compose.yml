services:
  dev-container:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-dev-container:antigravity
    container_name: dev-container
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
      - ${HOST_SSH_DIR:-${HOME}/.ssh}:/root/.ssh:ro
      - ${HOST_GITCONFIG:-${HOME}/.gitconfig}:/root/.gitconfig:ro
      - ./antigravity-config:/root/.gemini/antigravity-cli
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    restart: unless-stopped
